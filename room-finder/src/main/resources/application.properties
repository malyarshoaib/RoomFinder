# 1. Database Connection Details
# Set these environment variables in your terminal or IDE before starting.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Hibernate / JPA Settings
# 'update' tells Spring Boot to automatically create or update your database tables based on your Java code
spring.jpa.hibernate.ddl-auto=update

# 3. Console Output Logging (Optional but highly recommended for debugging)
# This will print the actual SQL commands Spring Boot is running behind the scenes
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true