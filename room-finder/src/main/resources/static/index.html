<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Finder</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; max-width: 800px; margin: auto; }
        .form-group { margin-bottom: 20px; padding: 20px; background-color: #f8f9fa; border-radius: 5px; }
        select, input { padding: 10px; font-size: 16px; margin-right: 15px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 15px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        #message { margin-top: 15px; font-weight: bold; color: #d9534f; }
    </style>
</head>
<body>

<h2>Campus Room Finder</h2>

<div class="form-group">
    <label for="daySelect"><strong>Day:</strong></label>
    <select id="daySelect">
        <option value="M">Monday</option>
        <option value="T">Tuesday</option>
        <option value="W">Wednesday</option>
        <option value="R">Thursday</option>
        <option value="F">Friday</option>
    </select>

    <label for="timeInput"><strong>Time:</strong></label>
    <input type="time" id="timeInput" value="11:00">

    <button onclick="fetchRooms()">Search</button>
</div>

<div id="message"></div>

<table id="resultsTable" style="display: none;">
    <thead>
    <tr>
        <th>Building</th>
        <th>Room Number</th>
    </tr>
    </thead>
    <tbody id="tableBody">
    <!-- Data will be injected here by JavaScript -->
    </tbody>
</table>

<script>
    function fetchRooms() {
        const day = document.getElementById('daySelect').value;
        let time = document.getElementById('timeInput').value;
        const messageBox = document.getElementById('message');
        const table = document.getElementById('resultsTable');
        const tableBody = document.getElementById('tableBody');

        if (!time) {
            messageBox.innerText = "Please select a time.";
            return;
        }

        // HTML time inputs return HH:MM. Your backend expects HH:MM:SS, so we append the seconds.
        if (time.length === 5) {
            time += ":00";
        }

        // Dynamically build the URL based on user input
        const apiUrl = `http://localhost:8080/api/rooms/empty?day=${day}&time=${time}`;

        messageBox.innerText = "Loading...";
        messageBox.style.color = "#333";
        table.style.display = 'none';
        tableBody.innerHTML = '';

        fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                messageBox.innerText = "";

                if (data.length === 0) {
                    messageBox.innerText = "No empty rooms found for this day and time.";
                    messageBox.style.color = "#d9534f";
                    return;
                }

                // Loop through the JSON array and create a table row for each room
                data.forEach(room => {
                    const row = `<tr>
                                        <td>${room.building}</td>
                                        <td>${room.roomNumber}</td>
                                     </tr>`;
                    tableBody.innerHTML += row;
                });

                // Show the table once populated
                table.style.display = 'table';
            })
            .catch(error => {
                messageBox.innerText = "Error fetching data: " + error.message;
                messageBox.style.color = "#d9534f";
            });
    }
</script>
</body>
</html>
